server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — reenvía a FastAPI interno por la red de Docker
    location ~ ^/(pipeline|feedback|rag|search|health|evaluation|docs|openapi\.json|redoc) {
        proxy_pass         http://sri-dx-api:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Necesario para SSE (streamPipeline usa Server-Sent Events)
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
    }

    # SPA fallback — React Router necesita esto para rutas directas
    location / {
        try_files $uri $uri/ /index.html;
    }
}
