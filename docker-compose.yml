services:
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: sri-dx-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SriDxAdmin123!}
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - sri-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  sri-dx-api:
    build: .
    container_name: sri-dx-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - hf-cache:/root/.cache/huggingface
    environment:
      - OPENSEARCH_HOST=http://opensearch:9200
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "uvicorn",
        "sri_dx.app.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    networks:
      - sri-network
    depends_on:
      opensearch:
        condition: service_healthy

  sri-dx-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sri-dx-frontend
    ports:
      - "3000:80"
    networks:
      - sri-network
    depends_on:
      sri-dx-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


networks:
  sri-network:
    driver: bridge

volumes:
  opensearch-data:
    driver: local
  hf-cache:
    driver: local
