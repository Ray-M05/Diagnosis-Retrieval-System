services:
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: sri-dx-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-SriDxAdmin123!}
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    networks:
      - sri-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  sri-dx:
    build: .
    container_name: sri-dx-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      - WATCH_FILES=true
      - OPENSEARCH_HOST=http://opensearch:9200
    command:
      [
        "/app/.venv/bin/python",
        "-m",
        "streamlit",
        "run",
        "src/sri_dx/app/ui/ui_streamlit.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    networks:
      - sri-network
    depends_on:
      opensearch:
        condition: service_healthy

networks:
  sri-network:
    driver: bridge

volumes:
  opensearch-data:
    driver: local
