[project]
name = "sri-dx"
version = "0.1.0"
description = "SRI Project - Diagnosis Retrieval (no diagnóstico)"
readme = "README.md"
requires-python = ">=3.11"

# Base mínima: cosas que casi seguro usamos siempre
dependencies = [
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28.1",
  "lxml>=6.0.2",
  "pypdf>=6.7.5",
  "pyyaml>=6.0.3",
  "certifi>=2026.2.25",
  "opensearch-py>=2.0.0",
  "pyahocorasick>=2.0.0",
  "numpy>=2.0.0",
  "sentence-transformers>=2.2,<3",
  "transformers>=4.35,<5",
  "torch",
]

[project.optional-dependencies]
# Aceleración CPU para embeddings (2-4x más rápido sin GPU)
onnx = [
  "onnxruntime>=1.17,<2",
]

# UI (Corte 3)
ui = [
  "streamlit>=1.31,<2",
]

# API opcional (solo si de verdad la van a usar)
api = [
  "fastapi>=0.109,<1",
  "uvicorn>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

# RAG con Google Gemini API
rag = [
  "google-generativeai>=0.7,<1",
]

# Utilidades de datos (si las necesitan)
data = [
  "pandas>=2.2,<3",
]

[project.scripts]
sri-dx = "sri_dx.app.cli.cli:main"
download-models = "sri_dx.scripts.download_models:main"

# Dev deps estándar (PEP 735)
[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.3,<1",
]

# ---- UV: torch con soporte CUDA 12.4 (compatible con CUDA 12.5) ----
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
