[project]
name = "sri-dx"
version = "0.1.0"
description = "SRI Project - Diagnosis Retrieval (no diagnóstico)"
readme = "README.md"
requires-python = ">=3.11"

# Base mínima: cosas que casi seguro usamos siempre
dependencies = [
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "elasticsearch>=8.11,<9",
  "httpx>=0.28.1",
  "lxml>=6.0.2",
  "pypdf>=6.7.5",
  "pyyaml>=6.0.3",
  "certifi>=2026.2.25",
  "opensearch-py>=2.0.0",
]

[project.optional-dependencies]
# UI (Corte 3)
ui = [
  "streamlit>=1.31,<2",
]

# Neural IR (Corte 1/2 cuando toque embeddings)
# OJO: esto trae torch; lo forzamos a CPU abajo
neural = [
  "sentence-transformers>=2.2,<3",
  "torch",
]

# Vector store / ANN
vector = [
  "hnswlib>=0.7,<1",
]

# API opcional (solo si de verdad la van a usar)
api = [
  "fastapi>=0.109,<1",
  "uvicorn>=0.27,<1",
]

# Utilidades de datos (si las necesitan)
data = [
  "pandas>=2.2,<3",
]

[project.scripts]
sri-dx = "sri_dx.app.cli:main"

# Dev deps estándar (PEP 735)
[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.3,<1",
]

# ---- UV: forzar torch CPU (evita descargar paquetes NVIDIA CUDA) ----
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
