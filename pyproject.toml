[project]
name = "sri-dx"
version = "0.1.0"
description = "Diagnosis Retrieval System - SRI Project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.31.0",
    "sentence-transformers>=2.2.2",
    "hnswlib>=0.7.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "pandas>=2.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
]

[project.scripts]
sri-dx = "sri_dx.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
