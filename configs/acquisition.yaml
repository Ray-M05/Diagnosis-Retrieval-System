user_agent: "sri-dx-acquisition/0.1"
timeout_s: 20
per_domain_delay_s: 5
max_depth: 2
max_docs: 300
max_workers: 15
verify_ssl: false

whitelist_domains:
  - msdmanuals.com
  - mayoclinic.org
  - www.nhs.uk
  #   - www.cdc.gov

seeds:
  # - seed_id: seed_0012
  #   seed_group: msd_topics_en
