out:
  dir: data/processed
  html_name: docs_html.jsonl
  pdf_name: docs_pdf.jsonl

persist:
  min_words_html: 120
  min_words_pdf: 120
  max_out_links_html: 200

  skip_url_substrings:
    - "/about"
    - "/contact"
    - "/terms"
  #  - "/index"
    - "/all_"
    - "/tests-and-treatments"
    - "/symptoms"
    - "/medicines"
    - "/vaccinations"
    - "/search"

  detect_az_index: true